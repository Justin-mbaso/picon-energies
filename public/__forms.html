<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Picon Energies form registration</title>
  </head>
  <body>
    <form name="picon-contact" method="POST" action="/__forms.html" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="picon-contact">
      <input type="hidden" name="intent">
      <select name="service"></select>
      <input type="text" name="full-name">
      <input type="email" name="email">
      <input type="tel" name="phone">
      <select name="project-scale"></select>
      <textarea name="message"></textarea>
      <input type="text" name="website">
    </form>
  </body>
</html>
